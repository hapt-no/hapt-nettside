body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Barlow',system-ui,sans-serif;font-variant-numeric:tabular-nums;}
.rad{display:flex;align-items:baseline;white-space:nowrap;line-height:1;}
.n{font-weight:500;}
.e{font-weight:300;color:#7d828a;margin-left:.18em;margin-right:.55em;}
.rad .e:last-child{margin-right:0;}
#tid{font-size:min(15vw,30vh);}
.e{font-size:.42em;}
#tekst[hidden]{display:none;}#tekst{margin-top:6vh;font-weight:300;font-size:min(2.6vw,4vh);color:#7d828a;letter-spacing:.06em;text-transform:uppercase;}

<body>
<div class="rad" id="tid"><span class="n" id="h">00</span><span class="e">hrs</span><span class="n" id="m">00</span><span class="e">min</span><span class="n" id="s">00</span><span class="e">sec</span></div>
<div id="tekst" hidden>Friday 15:20</div>
<script>
(function(){
  // Fredag 23.10.2026 kl. 15:20 i Oslo (sommertid, UTC+2)
  var mal = Date.parse('2026-10-23T15:20:00+02:00');
  var q = new URLSearchParams(location.search).get('til');
  if (q) {
    ['+02:00','+01:00'].some(function(off){
      var t = Date.parse(q.slice(0,16) + ':00' + off);
      if (isNaN(t)) return false;
      var oslo = new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Oslo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(t)).replace(' ','T');
      if (oslo === q.slice(0,16)) { mal = t; return true; }
      return false;
    });
    var d = new Date(mal);
    document.getElementById('tekst').textContent =
      d.toLocaleDateString('en-GB',{timeZone:'Europe/Oslo',weekday:'long'}) + ' ' +
      d.toLocaleTimeString('en-GB',{timeZone:'Europe/Oslo',hour:'2-digit',minute:'2-digit'});
  }
  function el(id){ return document.getElementById(id); }
  function to(n){ return (n < 10 ? '0' : '') + n; }
  function tikk(){
    var s = Math.max(0, Math.ceil((mal - Date.now()) / 1000));
    var t = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sek = s % 60;
    el('h').textContent = to(t); el('m').textContent = to(m); el('s').textContent = to(sek);
    if (s === 0) return;
    setTimeout(tikk, 1000 - (Date.now() % 1000) + 5);
  }
  tikk();
})();
</script>
