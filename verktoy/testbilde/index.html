<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Testbilde – HAPT verktøy</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../verktoy.css">
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:300;font-display:swap;src:url(../../fonts/barlow-latin-300-normal.woff2) format('woff2');}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(../../fonts/barlow-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(../../fonts/barlow-latin-500-normal.woff2) format('woff2');}
.preview { background: repeating-conic-gradient(#16181b 0% 25%, #101214 0% 50%) 50% / 20px 20px; }
.preview canvas { image-rendering: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="brand" href="../"><img src="../hapt-ordmerke-hvit.svg" alt="HAPT"><span>Verktøy</span></a>
    <nav><a href="../led/">LED-vegg</a><a href="./" aria-current="page">Testbilde</a><a href="../edid/">EDID</a></nav>
  </header>

  <h1>Testbilde</h1>
  <p class="lead">Lag et testbilde i riktig oppløsning. Med panelstørrelse får du panelkart med nummer på hvert panel.</p>

  <div class="grid">
    <div>
      <div class="card">
        <div class="field">
          <label for="mal">Oppløsning</label>
          <select id="mal">
            <option value="1920x1080">1920 × 1080 (Full HD)</option>
            <option value="3840x2160">3840 × 2160 (UHD)</option>
            <option value="1280x720">1280 × 720</option>
            <option value="1920x1200">1920 × 1200</option>
            <option value="2560x1440">2560 × 1440</option>
            <option value="4096x2160">4096 × 2160 (DCI 4K)</option>
            <option value="1080x1920">1080 × 1920 (stående)</option>
            <option value="egen">Egen</option>
          </select>
        </div>
        <div class="row">
          <div class="field"><label for="w">Bredde (px)</label><input id="w" type="number" min="16" max="16384" value="1920"></div>
          <div class="field"><label for="h">Høyde (px)</label><input id="h" type="number" min="16" max="16384" value="1080"></div>
        </div>
        <div class="row">
          <div class="field"><label for="pw">Panel bredde (px)</label><input id="pw" type="number" min="0" value="0"></div>
          <div class="field"><label for="ph">Panel høyde (px)</label><input id="ph" type="number" min="0" value="0"></div>
        </div>
        <p class="note" style="margin-top:-6px">0 = uten panelkart. Kom du fra LED-kalkulatoren, er dette fylt ut.</p>
        <div class="field"><label for="tittel">Tekst</label><input id="tittel" type="text" placeholder="F.eks. Hovedskjerm"></div>
      </div>

      <div class="card">
        <h2>Innhold</h2>
        <label class="check"><input type="checkbox" id="o-paneler" checked> Panelkart med nummer</label>
        <label class="check"><input type="checkbox" id="o-rutenett" checked> Rutenett</label>
        <label class="check"><input type="checkbox" id="o-sirkel" checked> Sirkel og kryss</label>
        <label class="check"><input type="checkbox" id="o-diag"> Diagonaler</label>
        <label class="check"><input type="checkbox" id="o-farger" checked> Fargestriper og gråtrapp</label>
        <label class="check"><input type="checkbox" id="o-kant" checked> Kantlinje og hjørnepiler</label>
        <label class="check"><input type="checkbox" id="o-logo" checked> HAPT-logo</label>
        <label class="check"><input type="checkbox" id="o-tekst" checked> Oppløsning og tekst</label>
        <div class="row" style="margin-top:10px">
          <div class="field"><label for="ruter">Rutenett hver (px)</label><input id="ruter" type="number" min="8" value="120"></div>
          <div class="field"><label for="farge">Linjefarge</label>
            <select id="farge"><option value="#1a8fd1">HAPT-blå</option><option value="#ffffff">Hvit</option><option value="#ffd400">Gul</option><option value="#00ff00">Grønn</option></select>
          </div>
        </div>
      </div>

      <div class="btns">
        <button class="btn" type="button" id="last">Last ned PNG</button>
      </div>
    </div>

    <div>
      <div class="preview"><canvas id="c" width="1920" height="1080"></canvas></div>
      <p class="note" id="info"></p>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('c'), ctx = cv.getContext('2d');
  var logo = new Image(), logoKlar = false;
  logo.onload = function () { logoKlar = true; tegn(); };
  logo.src = '../hapt-ordmerke-hvit.svg';

  // Fyll inn fra adressen (fra LED-kalkulatoren): ?w=&h=&pw=&ph=&navn=
  var q = new URLSearchParams(location.search);
  if (q.get('w')) {
    $('w').value = q.get('w'); $('h').value = q.get('h');
    $('pw').value = q.get('pw') || 0; $('ph').value = q.get('ph') || 0;
    if (q.get('tekst')) $('tittel').value = q.get('tekst');
    if (+q.get('pw') > 0) $('o-rutenett').checked = false; // panelkartet er rutenett nok
  }
  function oppdaterMal() {
    var v = $('w').value + 'x' + $('h').value, fins = false;
    Array.prototype.forEach.call($('mal').options, function (o) { if (o.value === v) fins = true; });
    $('mal').value = fins ? v : 'egen';
  }
  oppdaterMal();

  function tegn() {
    var W = Math.max(16, Math.min(16384, Math.round(+$('w').value || 1920)));
    var H = Math.max(16, Math.min(16384, Math.round(+$('h').value || 1080)));
    var pw = Math.round(+$('pw').value || 0), ph = Math.round(+$('ph').value || 0);
    var linje = $('farge').value;
    cv.width = W; cv.height = H;
    var m = Math.min(W, H);
    var lw = Math.max(1, Math.round(m / 540));
    var font = function (px, vekt) { return (vekt || 400) + ' ' + Math.round(px) + 'px Barlow, Helvetica, Arial, sans-serif'; };

    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    var harPaneler = $('o-paneler').checked && pw > 0 && ph > 0;
    // Panelkart: annenhver mørk flate så panelkanter synes, med nummer kolonne.rad
    if (harPaneler) {
      var kol = Math.ceil(W / pw), rad = Math.ceil(H / ph);
      var nr = 0;
      for (var y = 0; y < rad; y++) for (var x = 0; x < kol; x++) {
        ctx.fillStyle = (x + y) % 2 ? '#1b1f24' : '#0f1114';
        ctx.fillRect(x * pw, y * ph, pw, ph);
      }
      ctx.strokeStyle = linje; ctx.lineWidth = 1;
      ctx.beginPath();
      for (x = 0; x <= kol; x++) { var xx = Math.min(W, x * pw) + 0.5 - (x * pw >= W ? 1 : 0); ctx.moveTo(xx, 0); ctx.lineTo(xx, H); }
      for (y = 0; y <= rad; y++) { var yy = Math.min(H, y * ph) + 0.5 - (y * ph >= H ? 1 : 0); ctx.moveTo(0, yy); ctx.lineTo(W, yy); }
      ctx.stroke();
      var fs = Math.max(9, Math.min(pw, ph) * 0.16);
      ctx.fillStyle = 'rgba(236,237,238,0.55)'; ctx.font = font(fs, 500); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      for (y = 0; y < rad; y++) for (x = 0; x < kol; x++) {
        nr++;
        ctx.fillText((x + 1) + '.' + (y + 1), x * pw + fs * 0.4, y * ph + fs * 0.35);
        if (Math.min(pw, ph) >= 96) {
          ctx.save(); ctx.font = font(fs * 0.6); ctx.fillStyle = 'rgba(125,130,138,0.7)';
          ctx.fillText('#' + nr, x * pw + fs * 0.4, y * ph + fs * 1.45); ctx.restore();
        }
      }
    } else if ($('o-rutenett').checked) {
      ctx.fillStyle = '#0d0e10'; ctx.fillRect(0, 0, W, H);
    }

    // Rutenett, sentrert slik at en linje alltid går gjennom midten
    if ($('o-rutenett').checked) {
      var g = Math.max(8, +$('ruter').value || 120);
      ctx.strokeStyle = harPaneler ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1;
      ctx.beginPath();
      var x0 = (W / 2) % g, y0 = (H / 2) % g;
      for (var gx = x0; gx < W; gx += g) { ctx.moveTo(Math.round(gx) + 0.5, 0); ctx.lineTo(Math.round(gx) + 0.5, H); }
      for (var gy = y0; gy < H; gy += g) { ctx.moveTo(0, Math.round(gy) + 0.5); ctx.lineTo(W, Math.round(gy) + 0.5); }
      ctx.stroke();
    }

    if ($('o-diag').checked) {
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, H); ctx.moveTo(W, 0); ctx.lineTo(0, H); ctx.stroke();
    }

    if ($('o-sirkel').checked) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(W / 2, H / 2, m / 2 - lw, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = linje; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
      // Små sirkler i hjørnene for å se om bildet er strukket
      var r2 = m / 10;
      ctx.strokeStyle = '#fff';
      [[r2 * 1.3, r2 * 1.3], [W - r2 * 1.3, r2 * 1.3], [r2 * 1.3, H - r2 * 1.3], [W - r2 * 1.3, H - r2 * 1.3]].forEach(function (p) {
        ctx.beginPath(); ctx.arc(p[0], p[1], r2, 0, Math.PI * 2); ctx.stroke();
      });
    }

    var midtH = m * 0.12;
    if ($('o-farger').checked) {
      var bw = Math.min(W * 0.7, m * 1.2), bx = (W - bw) / 2, by = H / 2 + m * 0.06;
      var farger = ['#ffffff', '#ffff00', '#00ffff', '#00ff00', '#ff00ff', '#ff0000', '#0000ff', '#000000'];
      farger.forEach(function (f, i) { ctx.fillStyle = f; ctx.fillRect(Math.round(bx + i * bw / 8), by, Math.ceil(bw / 8), midtH); });
      for (var i = 0; i <= 10; i++) {
        var v = Math.round(i * 25.5);
        ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
        ctx.fillRect(Math.round(bx + i * bw / 11), by + midtH, Math.ceil(bw / 11), midtH * 0.45);
      }
      ctx.strokeStyle = '#7d828a'; ctx.lineWidth = 1; ctx.strokeRect(Math.round(bx) + 0.5, by + 0.5, Math.round(bw), Math.round(midtH * 1.45));
    }

    if ($('o-logo').checked && logoKlar) {
      var lh = m * 0.075, lwid = lh * (763.5 / 275.5);
      ctx.drawImage(logo, (W - lwid) / 2, H / 2 - m * 0.26, lwid, lh);
    }

    if ($('o-tekst').checked) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
      ctx.font = font(m * 0.06, 300);
      var ty = H / 2 - m * 0.1;
      // Mørk bakgrunn bak teksten så den kan leses over rutenettet
      var tekst = W + ' × ' + H;
      var tbw = ctx.measureText(tekst).width + m * 0.06;
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(W / 2 - tbw / 2, ty - m * 0.05, tbw, m * 0.1);
      ctx.fillStyle = '#fff'; ctx.fillText(tekst, W / 2, ty);
      var under = [];
      if ($('tittel').value.trim()) under.push($('tittel').value.trim());
      if (harPaneler) under.push(Math.ceil(W / pw) + ' × ' + Math.ceil(H / ph) + ' paneler à ' + pw + ' × ' + ph + ' px');
      if (under.length) {
        ctx.font = font(m * 0.03, 400);
        var y2 = $('o-farger').checked ? H / 2 + m * 0.06 + midtH * 1.45 + m * 0.06 : H / 2 + m * 0.06;
        under.forEach(function (t, i) {
          var w2 = ctx.measureText(t).width + m * 0.04;
          ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(W / 2 - w2 / 2, y2 + i * m * 0.05 - m * 0.022, w2, m * 0.044);
          ctx.fillStyle = i === 0 && $('tittel').value.trim() ? '#fff' : '#b9bdc3';
          ctx.fillText(t, W / 2, y2 + i * m * 0.05);
        });
      }
    }

    if ($('o-kant').checked) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
      ctx.strokeStyle = '#ff0000'; ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
      // Piler som peker ut mot hver kant
      var a = m * 0.035;
      ctx.fillStyle = linje;
      var pil = function (x, y, dx, dy) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - dx * a - dy * a * 0.6, y - dy * a - dx * a * 0.6);
        ctx.lineTo(x - dx * a + dy * a * 0.6, y - dy * a + dx * a * 0.6);
        ctx.closePath(); ctx.fill();
      };
      pil(W / 2, 3, 0, -1); pil(W / 2, H - 3, 0, 1); pil(3, H / 2, -1, 0); pil(W - 3, H / 2, 1, 0);
    }

    $('info').textContent = W + ' × ' + H + ' px' + (harPaneler ? ', ' + Math.ceil(W / pw) + ' × ' + Math.ceil(H / ph) + ' paneler' : '') + '. Lagres som PNG i full oppløsning.';
  }

  $('mal').addEventListener('change', function () {
    if (this.value === 'egen') return;
    var d = this.value.split('x'); $('w').value = d[0]; $('h').value = d[1]; tegn();
  });
  ['w', 'h'].forEach(function (id) { $(id).addEventListener('input', function () { oppdaterMal(); tegn(); }); });
  document.querySelectorAll('input, select').forEach(function (el) {
    if (el.id !== 'mal' && el.id !== 'w' && el.id !== 'h') el.addEventListener('input', tegn);
  });

  $('last').onclick = function () {
    tegn();
    cv.toBlob(function (blob) {
      var a = document.createElement('a');
      var navn = ($('tittel').value.trim() || 'testbilde').replace(/[^\wæøåÆØÅ-]+/g, '-');
      a.download = 'HAPT-' + navn + '-' + cv.width + 'x' + cv.height + '.png';
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }, 'image/png');
  };

  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('300 20px Barlow'), document.fonts.load('400 20px Barlow'), document.fonts.load('500 20px Barlow')]).then(tegn, tegn);
  }
  tegn();
})();
</script>
</body>
</html>
